name: Diagnose HKU listing (temporary)

# One read of HKU's new listing page to find how its work-type filter is
# addressed after the November 20 change. Read-only; removed once fixed.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-hku.yml']

permissions:
  contents: read

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Read the listing's filter controls
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from monitor.run import read_config
          from monitor.http import PublicClient
          sources, _ = read_config(Path('.'))
          source = dict(next(s for s in sources if s['id'] == 'hku'))
          source['url'] = 'https://jobs.hku.hk/en/listing'
          client = PublicClient(source)
          soup = BeautifulSoup(client.get(source['url']), 'html.parser')
          print('FORMS', [(f.get('action'), f.get('method'), f.get('id'), f.get('class')) for f in soup.find_all('form')])
          for tag in soup.find_all(['input', 'select', 'option', 'button']):
              attrs = {k: v for k, v in tag.attrs.items() if k in ('type', 'name', 'value', 'id', 'class') or k.startswith('data-')}
              if attrs.get('type') in ('checkbox', 'radio', 'hidden', 'text', 'search', 'submit') or tag.name in ('select', 'option', 'button'):
                  print('CONTROL', tag.name, attrs, repr(tag.get_text(' ', strip=True)[:40]))
          for a in soup.find_all('a', href=True):
              href = a['href']
              if any(word in href for word in ('filter', 'work-type', 'listing', 'search', 'page-items')):
                  print('LINK', href, '|', a.get_text(' ', strip=True)[:50])
          for tag in soup.find_all(True):
              for key, value in tag.attrs.items():
                  text = ' '.join(value) if isinstance(value, list) else str(value)
                  if 'work-type' in text or 'work_type' in text or 'worktype' in text.lower():
                      print('ATTR', tag.name, key, text[:160])
          print('SCRIPTS', [s.get('src') for s in soup.find_all('script') if s.get('src')][:15])
          for s in soup.find_all('script'):
              body = s.string or ''
              for word in ('filter', 'work-type', 'listing/?', 'search-keyword'):
                  i = body.find(word)
                  if i >= 0:
                      print('SCRIPT_TEXT', word, repr(body[max(0, i - 120):i + 160]))
          print('ROWS', len(soup.select('#search-results-content tr')), 'JOB_LINKS', len(soup.select('a.job-link[href]')))
          more = soup.select_one('#search-results a.more-link[href]')
          print('MORE', more['href'] if more else None)
          PY
