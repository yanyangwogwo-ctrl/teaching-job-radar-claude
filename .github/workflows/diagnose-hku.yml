name: Diagnose HKU listing (temporary)

# Reads HKU's new recruitment site (since 2026-11-20) a few times, paced 80 s
# apart, to learn its filters, result cards, paging and job pages. Read-only;
# removed once the new reader is in place.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-hku.yml']

permissions:
  contents: read

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Filtered list without query, paging, and one job page
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlencode
          from bs4 import BeautifulSoup
          from monitor.run import read_config
          from monitor.http import PublicClient

          sources, _ = read_config(Path('.'))
          source = dict(next(s for s in sources if s['id'] == 'hku'))
          source['url'] = 'https://jobs.hku.hk/jobs/search'
          client = PublicClient(source)

          def flat(text, limit):
              return re.sub(r'\s+', ' ', text)[:limit]

          url = 'https://jobs.hku.hk/jobs/search?' + urlencode([('employment_type_uids[]', 'a8dfe5e6ea2dd00e085f603d73791c5b'), ('employment_type_uids[]', 'cec6687bdfba952002d3eeba8babee99')])
          wanted, page = [], 0
          while url and page < 4:
              page += 1
              response = client.response(url)
              soup = BeautifulSoup(response.text, 'html.parser')
              cards = soup.select('article.job-search-results-card-col')
              kinds = Counter(flat(c.select_one('.job-component-employment-type span').get_text(' ', strip=True), 60) if c.select_one('.job-component-employment-type span') else None for c in cards)
              checked = [(i.get('name'), i.get('value'), flat((soup.find('label', attrs={'for': i.get('id')}) or i.parent).get_text(' ', strip=True), 50)) for i in soup.select('input[type=checkbox][checked]')]
              nxt = soup.select_one('a.page-link[rel~=next]')
              print('PAGE', page, response.status_code, response.url[:200], len(cards), 'cards', dict(kinds))
              print('CHECKED', checked)
              print('NEXT', nxt['href'] if nxt else None)
              for text in soup.find_all(string=re.compile(r'\b\d+\s+(jobs?|results?)\b', re.I))[:3]:
                  print('COUNT_TEXT', flat(text, 120))
              if page == 1 and cards:
                  print('CARD', flat(str(cards[0]), 4000))
              for card in cards:
                  link = card.select_one('.job-search-results-card-title a[href]')
                  wanted.append(link['href'])
                  print('JOB', flat(link.get_text(' ', strip=True), 80), '|', ' / '.join(flat(s.get_text(' ', strip=True), 50) for s in card.select('.job-component-icon-and-text span')))
              url = ('https://jobs.hku.hk' + nxt['href']) if nxt and nxt.get('href', '').startswith('/') else (nxt['href'] if nxt and nxt.get('href') else None)
          print('TOTAL', len(wanted), 'UNIQUE', len(set(wanted)))
          if wanted:
              response = client.response(wanted[0])
              soup = BeautifulSoup(response.text, 'html.parser')
              print('D FINAL', response.url, response.status_code)
              print('D H1', [flat(h.get_text(' ', strip=True), 160) for h in soup.find_all('h1')])
              for node in soup.select('li[class*=job-component]')[:20]:
                  print('D COMPONENT', node.get('class'), flat(node.get_text(' ', strip=True), 140))
              for selector in ('.job-description', '#job-description', '[class*=job-description]', '[class*=description]', '.job-details', 'article', 'main'):
                  for node in soup.select(selector)[:2]:
                      print('D BLOCK', selector, node.name, node.get('class'), node.get('id'), len(node.get_text(' ', strip=True)), flat(node.get_text(' ', strip=True), 300))
              for script in soup.find_all('script', attrs={'type': 'application/ld+json'}):
                  print('D JSONLD', flat(script.string or '', 4000))
              print('D APPLY', [a['href'] for a in soup.find_all('a', href=True) if re.search(r'apply', a.get_text(' ', strip=True), re.I)][:3])
          PY
